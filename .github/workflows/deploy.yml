name: Deploy

# Solo manual y desde main: el rol de despliegue solo confía en la rama main.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diff solo muestra los cambios; deploy los aplica'
        type: choice
        options: [diff, deploy]
        default: diff

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  cdk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      BLOG_ACCOUNT_ID: ${{ vars.BLOG_ACCOUNT_ID }}
      BLOG_HOSTED_ZONE_ID: ${{ vars.BLOG_HOSTED_ZONE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CDK_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
      - name: cdk diff
        run: npx cdk diff --all
      - name: cdk deploy
        if: inputs.mode == 'deploy'
        run: npx cdk deploy --all --require-approval never
