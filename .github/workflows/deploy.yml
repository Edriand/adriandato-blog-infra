name: Deploy

# Solo manual y desde main: el rol github-cdk solo confía en la rama main.
# No uses `environment:` en el job: cambia el sub del token OIDC y el rol no se puede asumir.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diff solo muestra los cambios; deploy los aplica'
        type: choice
        options: [diff, deploy]
        default: diff

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  cdk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # El ARN no es secreto: el rol solo confía en la rama main de este repo
          role-to-assume: arn:aws:iam::216625556188:role/github-cdk
          aws-region: eu-west-1
      - name: cdk diff
        run: npx cdk diff --all
      - name: cdk deploy
        if: inputs.mode == 'deploy'
        run: npx cdk deploy --all --require-approval never
